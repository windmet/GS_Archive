name: Web Viewer Source Gate

on:
  pull_request:
    paths:
      - ".github/workflows/web-viewer-source-gate.yml"
      - "data_pipeline/**"
      - "web_viewer/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/web-viewer-source-gate.yml"
      - "data_pipeline/**"
      - "web_viewer/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Source-only contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web_viewer

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web_viewer/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Check patch whitespace
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          else
            git show --check --format= HEAD
          fi

      - name: Verify authoritative schema
        run: npm run verify:story-schema

      - name: Verify localization runtime
        run: npm run verify:story-localization

      - name: Verify reading artifacts and repository
        run: npm run verify:reading

      - name: Verify playback feature ownership
        run: npm run verify:playback-controller

      - name: Verify translation contracts
        run: npm run verify:story-translations

      - name: Verify text evidence
        run: npm run verify:story-text

      - name: Verify audio lifecycle
        run: npm run verify:story-audio

      - name: Verify live-chibi audio inspection
        run: npm run verify:live-chibi-audio

      - name: Verify Runtime foundation
        run: node scripts/verify-story-runtime-foundation.mjs

      - name: Verify shared scenario normalization boundary
        run: npm run verify:shared-scenario-normalizer

      - name: Verify background loading lifecycle
        run: npm run verify:story-background-loading

      - name: Verify camera playback clock
        run: npm run verify:story-camera-clock

      - name: Verify screen transition playback clock
        run: npm run verify:story-screen-clock

      - name: Verify playback state across story steps
        run: npm run verify:story-step-playback-state

      - name: Verify performance registry handoff
        run: npm run verify:story-registry-handoff

      - name: Verify partial performance settlement
        run: npm run verify:story-partial-settlement

      - name: Verify Story timing semantics matrix
        run: npm run verify:story-timing-semantics -- --source-only

      - name: Verify Spine cue lifecycle and compiler parity
        run: npm run verify:story-spine-cues

      - name: Verify story stage loading ownership
        run: npm run verify:story-stage-loading

      - name: Verify named story catalog and full consumer parity
        run: npm run verify:story-catalog

      - name: Verify archive contracts and repository lifecycle
        run: npm run verify:archive-data

      - name: Verify navigation state and route projection
        run: npm run verify:archive-navigation-state

      - name: Verify mobile portal return and deep-link contract
        run: npm run verify:portal-navigation

      - name: Verify asynchronous navigation ownership
        run: npm run verify:archive-async-navigation

      - name: Verify card voice preview adapter
        run: npm run verify:card-voice-preview

      - name: Verify card filtering boundary
        run: npm run verify:card-filters

      - name: Verify gasha catalog boundary
        run: npm run verify:gasha-catalog

      - name: Verify idol page projections
        run: npm run verify:idol-page

      - name: Verify unit page projections
        run: npm run verify:unit-page

      - name: Verify archive startup route freshness
        run: npm run verify:archive-startup-route

      - name: Verify episode queue ownership and range restoration
        run: npm run verify:episode-queue

      - name: Verify scenario compiler package compatibility
        run: npm run verify:scenario-package

      - name: Verify isolated scenario resource providers
        run: npm run verify:scenario-resources

      - name: Verify candidate resource source configuration
        run: npm run verify:scenario-source-config

      - name: Verify RAW evidence boundaries
        run: npm run verify:raw-evidence-boundaries

      - name: Verify masterdata wire boundary
        run: npm run verify:masterdata-wire

      - name: Verify masterdata identity domain
        run: npm run verify:masterdata-identities

      - name: Verify masterdata media domains
        run: npm run verify:masterdata-media

      - name: Verify masterdata interaction domains
        run: npm run verify:masterdata-interactions

      - name: Verify work story input boundary
        run: npm run verify:masterdata-work

      - name: Verify story masterdata domains
        run: npm run verify:masterdata-story-domains

      - name: Verify card gameplay domain
        run: npm run verify:masterdata-card-gameplay

      - name: Verify card index split
        run: npm run verify:masterdata-cards

      - name: Verify event and gasha evidence
        run: npm run verify:masterdata-events-gasha

      - name: Verify masterdata resource inputs
        run: npm run verify:masterdata-resource-inputs

      - name: Verify masterdata output transport
        run: npm run verify:masterdata-output-io

      - name: Verify masterdata package entrypoint
        run: npm run verify:masterdata-entrypoint

      - name: Verify independent masterdata jobs
        run: npm run verify:masterdata-generation-jobs

      - name: Verify release soak recorder
        run: npm run verify:release-soak

      - name: Verify silhouette fallback contract
        run: npm run verify:silhouette

      - name: Verify archive source configuration
        run: npm run verify:archive-sources

      - name: Verify shared archive asset HTTP contract
        run: npm run verify:archive-assets

      - name: Verify current archive baseline report
        run: npm run verify:archive-baseline:source-only

      - name: Verify card semantic dictionaries
        run: npm run verify:card-semantic-dictionaries

      - name: Verify MovieAnnounce masterdata index
        run: npm run verify:movie-announce-index -- --source-only

      - name: Verify card skill-movie masterdata index
        run: npm run verify:card-skill-movie-index -- --source-only

      - name: Verify SongData movie masterdata index
        run: npm run verify:song-movie-index -- --source-only

      - name: Verify gasha movie client contract
        run: npm run verify:gasha-movie-client-contract

      - name: Verify RAW USM relation catalog
        run: npm run verify:usm-relation-catalog -- --source-only

      - name: Verify RAW image bundle relation catalog
        run: npm run verify:image-bundle-relation-catalog -- --source-only

      - name: Verify authoritative Story publications
        run: npm run verify:authoritative-story-publications -- --source-only

      - name: Verify external Story resources
        run: npm run verify:external-story-resources && npm run verify:external-story-resource-ui

      - name: Verify tracked binary inventory
        run: npm run verify:tracked-binary-inventory

      - name: Verify publication ledger
        run: >-
          npm run verify:publication-ledger --
          --base-sha "${{ github.event.pull_request.base.sha || github.event.before }}"

      - name: Verify RAW character-image candidate contract
        run: npm run verify:raw-character-candidate

      - name: Verify RAW character-image promotion contract
        run: npm run verify:raw-character-promotion

      - name: Verify strict collection publisher
        run: npm run verify:story-authoritative-publish

      - name: Verify RAW single-story publisher
        run: npm run verify:story-raw-promotion

      - name: Verify compiled migration
        run: npm run verify:compiled-migration

      - name: Build production bundle
        run: npm run build
