<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/assets/brand/image_chara_icon_producer.png" />
    <title>GROWING STARS 资料馆 · 偶像大师 SideM</title>
    <link rel="preload" as="font" type="font/woff2" href="/src/styles/fonts/barlow-semi-condensed-700-italic-latin.woff2" crossorigin />
    <!-- Shown from the HTML alone until the app mounts over it (the entry script takes seconds on a slow
         phone). Not faded in: Chrome does not count content that starts transparent as a first paint.
         It is the archive curtain of LoadingScreen.vue drawn without the app: brand lockup in the middle,
         the Now Loading badge (GsLoadingIndicator, badge) in the bottom-right corner. When the app mounts,
         the curtain takes over in the same place, so only the message changes. Values from GS_UI_TOKENS;
         change both together. -->
    <style>
      @font-face { font-family: "GS Stage"; font-style: italic; font-weight: 700; font-display: swap; src: url("/src/styles/fonts/barlow-semi-condensed-700-italic-latin.woff2") format("woff2"); unicode-range: U+0000-00FF; }
      @font-face { font-family: "GS Stage"; font-style: normal; font-weight: 600; font-display: swap; src: url("/src/styles/fonts/barlow-semi-condensed-600-latin.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2014; }
      .gs-boot { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: flex-end; box-sizing: border-box; padding: max(clamp(16px, 3vw, 44px), env(safe-area-inset-top, 0px)) max(clamp(16px, 3vw, 44px), env(safe-area-inset-right, 0px)) max(clamp(16px, 3vw, 44px), env(safe-area-inset-bottom, 0px)) max(clamp(16px, 3vw, 44px), env(safe-area-inset-left, 0px)); background: #f5f6f8; color: #13213a; font-family: "Noto Sans SC", "Noto Sans JP", "PingFang SC", "Hiragino Sans", "Microsoft YaHei", system-ui, sans-serif; }
      .gs-boot-brand { position: absolute; inset: 0 0 8vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0 16px; text-align: center; color: #6a7586; font-size: 13px; line-height: 1.5; }
      .gs-boot-brand > span { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; color: #13213a; text-align: left; }
      .gs-boot-brand em { font-style: normal; }
      .gs-boot-brand i { width: 28px; height: 1px; background: #e2e5eb; }
      .gs-boot-brand b { font: 600 13px/1 "GS Stage", "Arial Narrow", system-ui, sans-serif; letter-spacing: .12em; font-variant-numeric: tabular-nums; }
      .gs-boot-brand img { flex: none; width: 52px; height: 40px; object-fit: contain; filter: brightness(0); }
      .gs-boot-brand span span { display: flex; flex-direction: column; gap: 7px; }
      .gs-boot-brand strong { font: italic 700 28px/1 "GS Stage", "Arial Narrow", "Noto Sans SC", system-ui, sans-serif; letter-spacing: .02em; white-space: nowrap; }
      .gs-boot-brand small { color: #6a7586; font-size: 14px; letter-spacing: .08em; line-height: 1; white-space: nowrap; }
      .gs-boot-load { position: relative; display: grid; justify-items: end; gap: 0.65rem; max-width: min(22rem, 100%); padding: 2px; }
      .gs-boot-badge { display: inline-flex; align-items: center; gap: 0.65rem; padding: 0.4rem 0.8rem; border: 2px solid #fff; border-radius: 0.45rem; background: repeating-linear-gradient(132deg, transparent 0 4px, rgb(255 255 255 / 19%) 4px 5px), linear-gradient(155deg, #f4f5f8, #e5e8ed); color: #183064; box-shadow: 0 0 0 1px #b9c4cd, 0 3px 12px rgb(10 29 41 / 10%); font: 800 1.45rem/1.12 "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif; letter-spacing: -0.045em; white-space: nowrap; }
      .gs-boot-badge svg { display: block; width: 3rem; height: 3rem; flex: 0 0 3rem; overflow: visible; }
      .gs-boot-badge circle { fill: none; stroke: #7b7e9c; stroke-width: 6; }
      .gs-boot-badge circle + circle { stroke: #20d6b5; stroke-linecap: round; stroke-dasharray: 18 82; transform-origin: 24px 24px; animation: gs-boot-orbit 1.15s linear infinite; }
      .gs-boot-load p { margin: 0; color: #365c60; font-size: 0.875rem; font-weight: 500; line-height: 1.65; white-space: nowrap; }
      @keyframes gs-boot-orbit { to { transform: rotate(360deg); } }
      @media (max-height: 420px) { .gs-boot { padding: 12px; } }
      @media (prefers-reduced-motion: reduce) { .gs-boot-badge circle + circle { animation: none; transform: rotate(24deg); } }
    </style>
  </head>
  <body>
    <div id="app"><div class="gs-boot" role="status"><div class="gs-boot-brand" aria-hidden="true"><span><img src="/assets/brand/image_logo_imas_M_mark.png" alt="" width="52" height="40" /><span><strong>GROWING STARS</strong><small>SideM 资料馆</small></span></span><em>《偶像大师 SideM GROWING STARS》非官方资料馆</em><i></i><b>2021.10.06 — 2023.07.31</b></div><div class="gs-boot-load"><div class="gs-boot-badge" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" /><circle cx="24" cy="24" r="18" pathLength="100" /></svg>Now Loading</div><p>正在打开资料馆…</p></div></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
