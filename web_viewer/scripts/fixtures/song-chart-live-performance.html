<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>五轨谱面渲染诊断</title>
  <style>body{font:16px system-ui;margin:16px}#app{max-width:1280px}button{min-height:40px}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:inline-block;margin:6px}</style>
</head>
<body>
  <h1>五轨谱面渲染诊断</h1>
  <p>真实音频与 rAF。A 保留音符端点，B 加入 Hold、Middle 和连接，C 加入自动演示，D 再加入 Combo。请保持页面前台。</p>
  <label>EXPERT
    <select id="song">
      <option value="ldyrdm">Leading Your Dream · 高密度</option>
      <option value="infoct">Infinite Octave! · BPM 变化</option>
      <option value="cfprde">Café Parade!</option>
      <option value="knwonl">K.now O.nly</option>
      <option value="remasq">Reversed Masquerade</option>
    </select>
  </label>
  <label>起点（秒）<input id="start" type="number" min="0" step=".01" placeholder="自动"></label>
  <label>采样时长（秒）<input id="duration" type="number" min="3" max="60" value="8"></label>
  <label><input id="milestone" type="checkbox">从 Combo 315 前一秒开始</label>
  <button id="run" disabled>采样 A–D</button>
  <a id="download" hidden download="chart-render-audit.json">下载报告与逐帧数据</a>
  <output id="status" role="status">正在加载…</output>
  <div id="app"></div>
  <pre id="result"></pre>
  <script type="module" src="./song-chart-live-performance.js"></script>
</body>
</html>
