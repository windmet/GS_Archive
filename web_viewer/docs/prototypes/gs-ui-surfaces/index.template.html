<script id="fixture-data" type="application/json">__DATA__</script>
<script>
'use strict';
const corpus=JSON.parse(document.getElementById('fixture-data').textContent);
const queryParams=new URLSearchParams(location.search);
const initialKey=queryParams.has('entity')?queryParams.get('entity'):'honor:30025116';
const ui={query:queryParams.get('q')||'',kind:['all','item','honor'].includes(queryParams.get('kind'))?queryParams.get('kind'):'all',locale:'zh-CN',selected:corpus.fixtures.some(r=>r.key===initialKey)?initialKey:null,openerKey:null,openerSample:false,sourceScope:'',sourceOpen:true};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const name=r=>ui.locale==='ja'?r.nameJa:r.nameZh;
const description=r=>ui.locale==='ja'?r.descriptionJa:r.descriptionZh;
const labels={point:'累计点数',ranking:'排名奖励','idol-ranking':'偶像排名',repeated:'重复点数奖励',panel:'歌曲面板','seasonal-story':'季节剧情','source-table':'客户端来源'};
const sourceLabels={40:'制作人等级',41:'制作人阶级',66:'主线剧情',68:'偶像剧情',72:'第零话',79:'生日剧情',83:'登录奖励',117:'企划登录奖励',183:'首页剧情'};
const fmt=v=>Number.isFinite(v)?new Intl.NumberFormat('zh-CN').format(v):'未记录';
function date(seconds){if(!Number.isFinite(seconds)||seconds<=0)return '未记录';const value=new Date(seconds*1000);if(value.getUTCFullYear()<=2000||value.getUTCFullYear()>=2099)return '配置占位日期';return new Intl.DateTimeFormat('zh-CN',{dateStyle:'medium',timeZone:'Asia/Tokyo'}).format(value)}
function period(r){if(!r.term)return '未记录';const open=r.termInfo?.open?.sentinelCandidate?null:r.term.openAt,close=r.termInfo?.close?.sentinelCandidate?null:r.term.closeAt;if(open==null&&close==null)return '未限定配置期';if(close==null)return `${date(open)} 起`;if(open==null)return `至 ${date(close)}`;return `${date(open)} — ${date(close)}`}
function kindLabel(r){return r.kind==='honor'?'称号':'道具'}
function symbol(r){return `<span class="record-symbol ${r.kind==='honor'?'honor':''}" aria-hidden="true">${kindLabel(r)}</span>`}
function filteredRows(){const q=ui.query.trim().toLocaleLowerCase();return corpus.fixtures.filter(r=>(ui.kind==='all'||r.kind===ui.kind)&&[r.nameJa,r.nameZh,r.descriptionJa,r.descriptionZh,r.id].join(' ').toLocaleLowerCase().includes(q))}
function listMarkup(){const rows=filteredRows();return rows.length?rows.map(r=>`<button type="button" class="catalog-row" data-open="${r.key}" aria-haspopup="dialog">${symbol(r)}<span><strong>${esc(name(r))}</strong><small>${kindLabel(r)} · ${r.sourceRecordCount?`${fmt(r.sourceRecordCount)} 条本地奖励来源记录`:'来源未知／尚未收录'}</small></span><span class="row-end">查看详情 ›</span></button>`).join(''):'<p class="empty" role="status">没有匹配的静态样本。试试原文名称、中文名称或编号。</p>'}
function factsMarkup(r){return `<dl class="facts"><div><dt>种类</dt><dd>${kindLabel(r)}</dd></div><div><dt>已知来源</dt><dd>${r.sourceRecordCount?`${fmt(r.sourceRecordCount)} 条奖励记录`:'未知／未收录'}</dd></div>${r.kind==='item'?`<div><dt>历史配置期</dt><dd>${esc(period(r))}</dd></div><div><dt>持有上限</dt><dd>${fmt(r.maxAmount)}</dd></div>`:`<div><dt>条目编号</dt><dd>${esc(r.id)}</dd></div><div><dt>来源范围</dt><dd>${r.sources.length?esc(labels[r.sources[0].scope]||'其他客户端来源'):'未知'}</dd></div>`}</dl>`}
function conditions(s){const out=[];if(s.totalPoint!==undefined)out.push(`${fmt(s.totalPoint)} PT`);if(s.upperRank!==undefined||s.lowerRank!==undefined)out.push(`第 ${fmt(s.upperRank??s.lowerRank)}–${fmt(s.lowerRank??s.upperRank)} 名`);if(s.dayCount!==undefined)out.push(`第 ${s.dayCount} 天`);if(s.intervalPoint!==undefined)out.push(`每 ${fmt(s.intervalPoint)} PT`);if(!out.length)out.push('条件未完整收录');if(Number.isFinite(s.amount))out.push(`× ${fmt(s.amount)}`);return out}
function sourceRows(r){const rows=r.sources.filter(s=>!ui.sourceScope||s.scope===ui.sourceScope);if(!rows.length)return '<p class="unknown">尚未收录此藏品的获取来源。来源未知，不推断解锁条件。</p>';return `<ol class="source-list">${rows.map(s=>`<li class="source-card"><strong>${esc(s.event?.title||sourceLabels[s.sourceTable]||labels[s.scope]||'其他客户端来源')}</strong><div class="conditions"><span>${esc(labels[s.scope]||'客户端来源')}</span>${conditions(s).map(c=>`<span>${esc(c)}</span>`).join('')}</div><details><summary>查看这条来源的原始记录</summary><p class="source-evidence">${esc(s.key)}<br>表 ${esc(s.sourceTable)} · 行 ${esc(s.sourceRowId)}${s.eventId?` · 活动 ${esc(s.eventId)}`:''}</p></details></li>`).join('')}</ol>`}
function sourcesMarkup(r){const scopes=[...new Set(r.sources.map(s=>s.scope).filter(Boolean))];return `<details class="sources detail-anchor" id="source-section" ${ui.sourceOpen?'open':''}><summary>已知来源与用途${r.sourceRecordCount?` · ${fmt(r.sourceRecordCount)} 条奖励记录`:''}</summary><p class="source-note">${r.sourceRecordCount?`静态样本展示 ${r.sources.length} / ${fmt(r.sourceRecordCount)} 条本地奖励记录。`:'本地记录未收录来源。'}历史配置不代表当前可获得；以下资料不代表完整解锁条件。</p>${scopes.length?`<label class="source-filter"><span>获取方式</span><select id="source-scope" aria-label="筛选静态来源记录"><option value="">全部</option>${scopes.map(s=>`<option value="${esc(s)}" ${ui.sourceScope===s?'selected':''}>${esc(labels[s]||s)}</option>`).join('')}</select></label>`:''}<div id="source-rows">${sourceRows(r)}</div></details>`}
function rawMarkup(r){return `<details class="raw-meta"><summary>原始资料</summary><dl class="facts"><div><dt>编号</dt><dd>${esc(r.id)}</dd></div><div><dt>资源键</dt><dd><code>${esc(r.resourceId)}</code></dd></div><div><dt>原文名称</dt><dd lang="ja">${esc(r.nameJa)}</dd></div><div><dt>记录文件</dt><dd><code>${esc(r.catalogPath)}</code></dd></div><div><dt>来源文件</dt><dd><code>${esc(r.sourcePath)}</code></dd></div></dl></details>`}
function identity(r){return `<div class="identity"><p class="eyebrow">${kindLabel(r)} · ${esc(r.id)}</p><h3 class="entry-name" id="entry-name">${esc(name(r))}</h3>${ui.locale==='zh-CN'&&r.nameJa!==r.nameZh?`<p class="original-name" lang="ja">${esc(r.nameJa)}</p>`:''}</div>`}
function compactBody(r){return `<div class="identity">${symbol(r)}<div><p class="eyebrow">${kindLabel(r)} · ${esc(r.id)}</p><h3 class="entry-name" id="entry-name">${esc(name(r))}</h3>${ui.locale==='zh-CN'&&r.nameJa!==r.nameZh?`<p class="original-name" lang="ja">${esc(r.nameJa)}</p>`:''}</div></div>${factsMarkup(r)}<details class="description-fold" open><summary>条目说明</summary><p class="entry-description">${esc(description(r)||'尚未收录说明。')}</p></details>${sourcesMarkup(r)}${rawMarkup(r)}`}
function balancedBody(r){return `<div class="overview"><div>${identity(r)}<p class="entry-description">${esc(description(r)||'尚未收录说明。')}</p></div>${factsMarkup(r)}</div>${sourcesMarkup(r)}${rawMarkup(r)}`}
function readingBody(r){return `${identity(r)}<p class="entry-description">${esc(description(r)||'尚未收录说明。')}</p>${ui.locale==='zh-CN'&&r.descriptionJa!==r.descriptionZh?`<details class="reading-original" open><summary>日文原文</summary><p lang="ja">${esc(r.descriptionJa)}</p></details>`:''}<details class="reading-meta" open><summary>条目资料</summary>${factsMarkup(r)}</details>${sourcesMarkup(r)}${rawMarkup(r)}`}
const densityNames=['Compact','Balanced','Reading-heavy'];
const densityClasses=['compact','balanced','reading'];
function dialogMarkup(i){const r=corpus.fixtures.find(r=>r.key===ui.selected);if(!r)return '';return `<div class="overlay ${densityClasses[i]}" data-backdrop><section class="surface" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="entry-name" tabindex="-1"><header class="surface-header"><div><h2 id="dialog-title">${kindLabel(r)}详情</h2><span class="density-label">${densityNames[i]}</span></div><div class="header-actions"><button type="button" class="close" data-language aria-label="切换中文与日文">${ui.locale==='zh-CN'?'日文':'中文'}</button><button type="button" class="close" data-close aria-label="关闭藏品详情">× <span>关闭</span></button></div></header><div class="surface-body">${[compactBody,balancedBody,readingBody][i](r)}</div><footer class="surface-footer"><span class="muted">未选定密度 · 同一组真实资料</span><button type="button" class="app-button" data-close>返回藏品目录</button></footer></section></div>`}
function pageMarkup(i){return `<main class="context" id="catalog-context" ${ui.selected?'inert':''}><header class="archive-top"><span class="brand">SideM <small>ARCHIVE</small></span><span>GS UI Foundation<br>详情密度试验</span></header><div class="page-title"><h1>藏品馆</h1><p>${corpus.fixtures.length} 条真实静态样本 · 未选择最终密度</p></div><div class="catalog-tools"><label class="search"><span aria-hidden="true">⌕</span><input id="catalog-search" type="search" aria-label="搜索藏品名称、说明或编号" placeholder="搜索中文、原文或编号…" value="${esc(ui.query)}"><button type="button" data-clear aria-label="清空搜索">×</button></label>${[['all','全部'],['item','道具'],['honor','称号']].map(([key,label])=>`<button type="button" class="app-button" data-kind="${key}" aria-pressed="${ui.kind===key}">${label}</button>`).join('')}</div><div class="scenario-tools"><span>真实资料样本：</span><button type="button" class="app-button" data-sample="item:303398">长票券名</button><button type="button" class="app-button" data-sample="honor:30025116">长姓名称号</button><button type="button" class="app-button" data-sample="item:101252">较长说明</button><button type="button" class="app-button" data-sample="item:10401">多来源</button><button type="button" class="app-button" data-sample="honor:30026001">来源未知</button></div><p class="catalog-count" id="catalog-count" role="status">显示 ${filteredRows().length} / ${corpus.fixtures.length} 条静态样本</p><div class="catalog-list" id="catalog-list">${listMarkup()}</div><p class="fixture-note">本地目录含 ${corpus.itemsTotal} 件道具、${corpus.honorsTotal} 件称号。本页仅提取 ${corpus.fixtures.length} 条记录用于布局比较，不是完整藏品目录。名称、译文、说明与来源条件均取自已有资料；未内嵌媒体图片。</p></main><div id="dialog-host">${dialogMarkup(i)}</div>`}
const variants=[()=>pageMarkup(0),()=>pageMarkup(1),()=>pageMarkup(2)];
// Normalize an invalid URL choice before the verbatim reference wiring runs.
if(queryParams.has('v')&&![1,2,3].includes(Number(queryParams.get('v')))){const url=new URL(location);url.searchParams.delete('v');history.replaceState(null,'',url)}
__PICKER_WIRING__

// Application interactions are separate from the unchanged picker wiring.
function saveContext(){const url=new URL(location);url.searchParams.set('entity',ui.selected||'');ui.query?url.searchParams.set('q',ui.query):url.searchParams.delete('q');ui.kind==='all'?url.searchParams.delete('kind'):url.searchParams.set('kind',ui.kind);history.replaceState(null,'',url)}
function refreshList(){document.getElementById('catalog-list').innerHTML=listMarkup();document.getElementById('catalog-count').textContent=`显示 ${filteredRows().length} / ${corpus.fixtures.length} 条静态样本`;stage.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.kind===ui.kind));saveContext()}
function refreshDialog(){document.getElementById('dialog-host').innerHTML=dialogMarkup(current);document.getElementById('catalog-context').inert=Boolean(ui.selected);document.body.classList.toggle('modal-open',Boolean(ui.selected));saveContext()}
function openRecord(key,opener){if(!corpus.fixtures.some(r=>r.key===key))return;ui.openerKey=opener?.dataset.open||opener?.dataset.sample||null;ui.openerSample=Boolean(opener?.dataset.sample);ui.selected=key;ui.sourceScope='';ui.sourceOpen=true;refreshDialog();stage.querySelector('[data-close]')?.focus({preventScroll:true})}
function closeDialog(){ui.selected=null;refreshDialog();const opener=ui.openerKey&&stage.querySelector(`[data-${ui.openerSample?'sample':'open'}="${ui.openerKey}"]`);(opener||document.getElementById('catalog-search'))?.focus({preventScroll:true})}
stage.addEventListener('click',e=>{const button=e.target.closest('button');if(button?.dataset.open)openRecord(button.dataset.open,button);else if(button?.dataset.sample)openRecord(button.dataset.sample,button);else if(button?.hasAttribute('data-close'))closeDialog();else if(button?.hasAttribute('data-language')){ui.locale=ui.locale==='zh-CN'?'ja':'zh-CN';refreshList();refreshDialog();stage.querySelector('[data-language]')?.focus({preventScroll:true})}else if(button?.hasAttribute('data-clear')){ui.query='';document.getElementById('catalog-search').value='';refreshList();document.getElementById('catalog-search').focus()}else if(button?.dataset.kind){ui.kind=button.dataset.kind;refreshList()}else if(e.target.hasAttribute('data-backdrop'))closeDialog()});
stage.addEventListener('input',e=>{if(e.target.id==='catalog-search'){ui.query=e.target.value;refreshList()}});
stage.addEventListener('change',e=>{if(e.target.id==='source-scope'){ui.sourceScope=e.target.value;const r=corpus.fixtures.find(r=>r.key===ui.selected);document.getElementById('source-rows').innerHTML=sourceRows(r)}});
stage.addEventListener('toggle',e=>{if(e.target.id==='source-section')ui.sourceOpen=e.target.open},true);
document.addEventListener('keydown',e=>{if(!ui.selected)return;if(e.key==='Escape'){e.preventDefault();closeDialog();return}if(e.key!=='Tab')return;const choices=[...stage.querySelectorAll('.surface button,.surface select,.surface summary'),...picker.querySelectorAll('button')].filter(n=>n.getClientRects().length&&!n.disabled&&(!n.closest('details')||n.tagName==='SUMMARY'||n.closest('details').open));const first=choices[0],last=choices.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}});
const mounted=new MutationObserver(records=>{if(!records.some(r=>r.target===stage))return;document.body.classList.toggle('modal-open',Boolean(ui.selected));if(ui.selected)stage.querySelector('[data-close]')?.focus({preventScroll:true})});
mounted.observe(stage,{childList:true});
</script>
</html>
